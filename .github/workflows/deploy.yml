name: Deploy Laravel App to HestiaCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-laravel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "${{ secrets.PROD_HOST != '' }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Đang triển khai mã nguồn lên Server..."
            cd ${{ secrets.PROD_TARGET_DIR }}
            git fetch origin main
            
            # Checkout code từ Git nhưng loại trừ .agents, các file .sql, database/sql, .example*, .env.testing, tests, phpunit*, public/images, docs và README
            git checkout origin/main -- . ':!.agents' ':!*.sql' ':!database/sql' ':!*.example*' ':!*.example' ':!.env.testing' ':!phpunit*' ':!tests' ':!public/images' ':!docs' ':!README*'
            
            # Đảm bảo dọn dẹp triệt để thư mục nội bộ AI (.agents), docs, tests, README, các file .example, .testing, phpunit và toàn bộ file .sql trên hosting server
            rm -rf .agents docs README.md README* database/sql tests
            rm -f .env.example .env.testing phpunit.xml
            find . -maxdepth 3 -name "*.sql" -type f -delete
            find . -maxdepth 2 -name "*.example*" -type f -delete
            
            # Đảm bảo nhận diện môi trường đường dẫn Composer
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.composer/vendor/bin
            if command -v composer &> /dev/null; then
                composer install --no-dev --optimize-autoloader --no-interaction
            elif [ -f /usr/local/bin/composer ]; then
                /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
            fi
            
            # Tối ưu bộ nhớ đệm Laravel
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            echo "✅ Triển khai website thành công!"